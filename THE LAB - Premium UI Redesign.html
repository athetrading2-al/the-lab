 $('#main').innerHTML=top('Calendar',`<button class="btn" id="prev-month" aria-label="Previous month">‹</button><b>${month.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn" id="next-month" aria-label="Next month">›</button>`)+
 `<section class="card"><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="muted-small">${x}</div>`).join('')}${days.map(d=>{let k=localDateKey(d),v=sums[k],n=counts[k]||0,inside=d.getMonth()===m,cls=v>0?'profit-day':v<0?'loss-day':v===0&&n?'break-even-day':'';return `<div class="day ${cls} ${selectedDay===k?'chosen':''}" data-day="${k}" style="opacity:${inside?1:.38}" aria-label="${k}, ${n} trades, ${v==null?'no P&L':fmt(v)}"><small>${d.getDate()}</small><strong class="${v>0?'net-positive':v<0?'net-negative':''}">${v==null?'—':fmt(v)}</strong><span class="day-count">${n} ${n===1?'trade':'trades'}</span></div>`}).join('')}</div></section>
 <div class="calendar-summary"><div class="card"><div class="mlabel">Month Total</div><div class="sum-value ${monthNet>0?'net-positive':monthNet<0?'net-negative':''}">${fmt(monthNet)}</div></div><div class="card"><div class="mlabel">Win Days</div><div class="sum-value net-positive">${winDays.length}</div></div><div class="card"><div class="mlabel">Loss Days</div><div class="sum-value net-negative">${lossDays.length}</div></div><div class="card"><div class="mlabel">Best Day</div><div class="sum-value">${best?fmt(sums[best]):'—'}</div><div class="muted-small">${best||'No profitable days'}</div></div></div>
 ${selectedDay?`<section class="card" style="margin-top:16px"><div class="card-head"><h2>${selectedDay} · Trades</h2><span class="muted-small">${(dayTrades[selectedDay]||[]).length} trades · ${fmt(sums[selectedDay]||0)}</span></div>${(dayTrades[selectedDay]||[]).map(t=>`<div class="row" style="justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)"><button class="btn" data-trade="${t.id}">${esc(t.symbol)} · ${esc(t.direction)} · ${esc(t.entryTime||'—')}</button><strong class="serif ${t.pnl>0?'net-positive':t.pnl<0?'net-negative':''}">${fmt(t.pnl)}</strong></div>`).join('')||'<p class="muted">No trades on this date.</p>'}</section>`:''}
 ${monthTrades.length?'':'<p class="empty">No trades recorded in this month for the selected account.</p>'}`;
}
function renderBooks(){let books=allBooks(),ts=scoped();$('#main').innerHTML=top('Playbook',`<button class="btn btn-primary" id="new-book">＋ New Playbook</button>`)+`<div class="cards-3">${books.map(b=>{let a=ts.filter(t=>t.playbookId===b.id),w=a.filter(t=>t.pnl>0).length,l=a.filter(t=>t.pnl<0).length,net=a.reduce((s,t)=>s+(+t.pnl||0),0);return `<article class="card"><h2>${esc(b.name)}</h2><p class="muted">${esc(b.description||'No description')}</p><div class="serif">${a.length} trades · ${w+l?((w/(w+l))*100).toFixed(1)+'%':'N/A'} win rate</div><p class="serif ${net>=0?'positive':'negative'}">${fmt(net)}</p><p class="muted-small">${esc(b.conditions||'')} </p><div class="actions"><button class="btn" data-edit-book="${b.id}">Edit</button><button class="btn" data-delete-book="${b.id}">Delete</button></div></article>`}).join('')}</div>${!books.length?'<div class="card empty">Create a playbook to organise your setups and rules.</div>':''}`}
function bookForm(b){openModal(`<h2>${b?'Edit':'Create'} Playbook</h2><form id="book-form"><div class="form-grid"><div class="field wide"><label>Name *</label><input class="input" name="name" required value="${esc(b?.name||'')}"></div><div class="field wide"><label>Description</label><textarea class="input" name="description">${esc(b?.description||'')}</textarea></div><div class="field wide"><label>Setup Conditions</label><textarea class="input" name="conditions">${esc(b?.conditions||'')}</textarea></div><div class="field wide"><label>Rules / Checklist</label><textarea class="input" name="rules">${esc(b?.rules||'')}</textarea></div><div class="field wide"><label>Notes</label><textarea class="input" name="notes">${esc(b?.notes||'')}</textarea></div></div><div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-primary">Save Playbook</button></div></form>`);$('#book-form').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let a=allBooks();let v={...b,...f,id:b?.id||id()};put('playbooks',b?a.map(x=>x.id===b.id?v:x):[...a,v]);$('#lab-modal').remove();renderBooks()}}
function renderPage(){let hash=location.hash.slice(1);if(hash==='accounts')renderAccounts();else if(hash==='journal')renderJournal();else if(hash==='pnl-calendar')renderCalendar();else if(hash==='playbooks')renderBooks();else return false;return true}
// Add dashboard account/time/trade controls without replacing the existing dashboard renderer.
function enhanceDashboard(){if(location.hash&&location.hash!=='#dashboard')return;let main=$('#main');if(!main)return;let h=main.querySelector('.dash-head');if(!h){h=main.firstElementChild;if(!h)return}if(!main.querySelector('#lab-greeting')){let prof=getProfileSafe(),hr=new Date().getHours(),sal=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';let greet=document.createElement('div');greet.id='lab-greeting';greet.className='greeting-wrap';greet.innerHTML=`<h1 class="greeting">${sal}${prof.name?', '+esc(prof.name):''}</h1><p class="greeting-sub">Your trading performance at a glance.</p>`;h.parentNode.insertBefore(greet,h)}if(main.querySelector('#lab-dash-tools'))return;let tools=document.createElement('div');tools.id='lab-dash-tools';tools.className='toolbar';tools.innerHTML=`<button class="btn btn-primary" id="add-trade">＋ Add Trade</button><div class="row">${accountSelector()}</div>`;main.insertBefore(tools,main.firstChild);}
function getProfileSafe(){try{return JSON.parse(localStorage.getItem('lab.profile')||'{}')}catch(e){return{}}}
// Delegated interactions
 document.addEventListener('click',e=>{let b=e.target.closest('button,[data-account-card],[data-trade],[data-day]');if(!b)return;
 if(b.matches('[data-close]')){$('#lab-modal')?.remove();return}
 if(b.id==='new-account')return accountForm();if(b.dataset.editAccount)return accountForm(accounts.find(a=>a.id===b.dataset.editAccount));if(b.dataset.deleteAccount){let a=accounts.find(x=>x.id===b.dataset.deleteAccount),n=allTrades().filter(t=>t.accountId===a.id).length;if(confirm(`Delete ${a.name}? This permanently removes its ${n} trades from this browser.`)){accounts=accounts.filter(x=>x.id!==a.id);if(active===a.id)active=accounts[0]?.id||null;saveAccounts();put('activeAccount',active);put('trades',allTrades().filter(t=>t.accountId!==a.id));renderAccounts()}return}
 if(b.id==='add-trade')return tradeForm();if(b.id==='new-book')return bookForm();if(b.dataset.editBook)return bookForm(allBooks().find(x=>x.id===b.dataset.editBook));if(b.dataset.deleteBook){let book=allBooks().find(x=>x.id===b.dataset.deleteBook);if(confirm(`Delete playbook “${book.name}”? Existing trades will keep their historical reference.`)){put('playbooks',allBooks().filter(x=>x.id!==book.id));renderBooks()}return}
 if(b.dataset.removeImage!=null){let i=+b.dataset.removeImage;imagesPlaceholder(i);return}
 if(b.dataset.trade){let t=scoped().find(x=>x.id===b.dataset.trade);if(!t)return;openModal(`<h2>${esc(t.symbol)} · ${esc(t.date)}</h2><div class="row"><b class="serif ${t.pnl>0?'positive':t.pnl<0?'negative':''}">${fmt(t.pnl)}</b><span class="pill">${esc(t.direction)}</span><span class="pill">${esc(t.session)}</span></div><div class="form-grid" style="margin-top:16px">${[['Entry time',t.entryTime],['Exit time',t.exitTime],['Entry',t.entry],['Exit',t.exit],['Stop',t.stop],['Duration',t.duration],['Risk to Reward',t.riskReward],['Plan followed',t.followedRules==null?'Not recorded':t.followedRules?'Yes':'No'],['Mistakes',t.mistakes],['Improvements',t.improvements],['Rule responses',Object.entries(t.ruleResponses||{}).map(([k,v])=>k.split('|').slice(1).join('|')+': '+(v===true?'Followed':v===false?'Not followed':'Not recorded')).join('\n')],['Notes',t.notes]].map(x=>`<div><div class="muted-small">${x[0]}</div><span style="white-space:pre-wrap">${esc(x[1]??'—')}</span></div>`).join('')}</div><div class="thumbs" style="margin-top:16px">${(t.images||[]).map(x=>`<a href="${x}" target="_blank"><img class="image-preview" src="${x}"></a>`).join('')}</div><div class="actions"><button class="btn" data-close>Close</button><button class="btn" id="edit-open-trade">Edit</button><button class="btn" id="delete-open-trade">Delete</button></div>`);$('#edit-open-trade').onclick=()=>{$('#lab-modal').remove();tradeForm(t)};$('#delete-open-trade').onclick=()=>{if(confirm('Delete this trade? All account metrics will be recalculated.')){put('trades',allTrades().filter(x=>x.id!==t.id));$('#lab-modal').remove();renderJournal();window.dispatchEvent(new Event('labdata'))}};return}
 if(b.dataset.accountCard){active=b.dataset.accountCard;put('activeAccount',active);renderAccounts();return}
 if(b.dataset.day){selectedDay=b.dataset.day;renderCalendar();return}
 if(b.id==='prev-month'){month.setMonth(month.getMonth()-1);renderCalendar()}if(b.id==='next-month'){month.setMonth(month.getMonth()+1);renderCalendar()}
 });
 document.addEventListener('change',e=>{if(e.target.id==='active-account'){active=e.target.value;put('activeAccount',active);if(location.hash==='#dashboard'){const m=$('#main');m.innerHTML='';location.hash='#dashboard';window.dispatchEvent(new Event('labdata'));setTimeout(enhanceDashboard,0)}else renderPage()}});
 function imagesPlaceholder(){}
 window.addEventListener('hashchange',()=>{if(renderPage())return;setTimeout(enhanceDashboard,0)});
 window.addEventListener('labdata',()=>{if(location.hash==='#journal')renderJournal();else if(location.hash==='#accounts')renderAccounts();else if(location.hash==='#playbooks')renderBooks();else setTimeout(enhanceDashboard,0)});window.addEventListener('labprofile',()=>{if(location.hash==='#dashboard'){const g=$('#lab-greeting');if(g){const p=getProfileSafe(),hr=new Date().getHours(),sal=hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';g.innerHTML=`<h1 class=\"greeting\">${sal}${p.name?', '+esc(p.name):''}</h1><p class=\"greeting-sub\">Your trading performance at a glance.</p>`}}});
 if(!active&&accounts.length){active=accounts[0].id;put('activeAccount',active)}
 if(renderPage()){}else setTimeout(enhanceDashboard,0);
})();

</script>
